server {
    listen 8080;
    listen [::]:8080;

    # Laravel's entry point is public/index.php, not the repo root —
    # Azure's default PHP Linux image serves from the repo root, so this
    # is the one thing that must be overridden. See startup.sh.
    root /home/site/wwwroot/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Block access to dotfiles (.env, .git, etc.) except .well-known
    # (needed for things like ACME/SSL challenges).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
